[project]
name = "insilicho"
version = "1.1.4"
description = "An insilico model for CHO cells"
authors = [
    { name = "Culture Biosciences", email = "matt@culturebiosciences.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "pandas>=2.0,<3",
    "Pint>=0.23,<1",
    "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "black>=24.0",
    "matplotlib>=3.8,<4",
    "pytest>=8.0",
    "pytest-cov>=5.0,<8",
    "pytest-timeout>=2.2,<3",
    "Sphinx>=7.0,<10",
    "sphinx-rtd-theme>=2.0,<4",
    "flake8>=7.0",
    "ipykernel>=7.0,<8",
    "pre-commit>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
